#=================================================
# Based on: https://github.com/P3TERX/Actions-OpenWrt
# Description: Build selected KWRT/OpenWrt targets using GitHub Actions
#=================================================

name: Build selected KWRT firmwares

on:
  push:
    paths:
      - '.github/workflows/Openwrt-AutoBuild.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_TOKEN: ${{ github.token }}
  TZ: Europe/Berlin
  REPO_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mediatek_filogic
            artifact_name: kwrt_bpi-r3_mediatek_filogic
            device_filters: "bananapi_bpi-r3"
          - target: mvebu_cortexa9
            artifact_name: kwrt_linksys_wrt1900ac-v1_wrt1200ac-v2_mvebu
            device_filters: "linksys_wrt1900ac-v1 linksys_wrt1200ac-v2"

    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load settings
        shell: bash
        run: |
          set -e
          echo "${{ matrix.target }}"
          source "${{ github.workspace }}/devices/common/settings.ini"
          if [ -f "${{ github.workspace }}/devices/${{ matrix.target }}/settings.ini" ]; then
            source "${{ github.workspace }}/devices/${{ matrix.target }}/settings.ini"
          fi

          echo "REPO_URL=${REPO_URL}" >> "$GITHUB_ENV"
          echo "CONFIG_FILE=${CONFIG_FILE}" >> "$GITHUB_ENV"
          echo "DIY_SH=${DIY_SH}" >> "$GITHUB_ENV"
          echo "FREE_UP_DISK=${FREE_UP_DISK}" >> "$GITHUB_ENV"

          echo "UPLOAD_BIN_DIR_FOR_ARTIFACT=false" >> "$GITHUB_ENV"
          echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=true" >> "$GITHUB_ENV"
          echo "UPLOAD_FIRMWARE_FOR_RELEASE=false" >> "$GITHUB_ENV"
          echo "UPLOAD_FIRMWARE_TO_COWTRANSFER=false" >> "$GITHUB_ENV"
          echo "UPLOAD_FIRMWARE_TO_WETRANSFER=false" >> "$GITHUB_ENV"

          sed -i "1a REPO_TOKEN=${{ github.token }}" "${{ github.workspace }}/devices/common/diy.sh"
          sed -i "1a TARGET=${{ matrix.target }}" "${{ github.workspace }}/devices/common/diy.sh"

      - name: Free disk space
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -e
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "${TZ}"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Get current date
        shell: bash
        run: |
          echo "date=$(date +'%Y%m%d-%H%M')" >> "$GITHUB_ENV"
          echo "date2=$(date +'%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          echo "VERSION=$(date +'%Y.%m.%d')" >> "$GITHUB_ENV"

      - name: Clone source code
        shell: bash
        run: |
          set -eux

          TAG_INFO="$(curl -gs \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -X POST \
            -d '{ "query": "query {repository(owner: "openwrt", name: "openwrt") {refs(refPrefix: "refs/tags/", first: 4, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {nodes {name target { ... on Tag {tagger {date}}}}}}}"}' \
            https://api.github.com/graphql)"

          TAG_DATE="$(echo "${TAG_INFO}" | jq -r '.data.repository.refs.nodes[] | select(.name | startswith("v25")) | .target.tagger.date' | head -n 1 || true)"

          if [[ -n "${TAG_DATE}" ]] && [[ $(( ($(date +%s) - $(date -d "${TAG_DATE}" +%s)) / 86400 )) -lt 10 ]]; then
            AUTO_BRANCH="$(echo "${TAG_INFO}" | jq -r '.data.repository.refs.nodes[].name' | grep '^v25' | head -n 1)"
          else
            AUTO_BRANCH="openwrt-25.12"
          fi

          if [[ -n "${REPO_BRANCH}" ]]; then
            if [[ ${#REPO_BRANCH} -lt 10 ]]; then
              git clone "${REPO_URL}" -b "${REPO_BRANCH}" openwrt
            else
              git clone "${REPO_URL}" openwrt
              cd openwrt
              git checkout "${REPO_BRANCH}"
              cd ..
            fi
          elif [[ "${REPO_URL}" == "https://github.com/openwrt/openwrt" ]]; then
            git clone "${REPO_URL}" -b "${AUTO_BRANCH}" openwrt
          else
            git clone "${REPO_URL}" openwrt
          fi

      - name: Free up disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir
          sudo ln -sf "${GITHUB_WORKSPACE}/openwrt/staging_dir" /mnt/openwrt/staging_dir

      - name: Load custom configuration
        shell: bash
        run: |
          set -eux

          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mvflag="$3"
            [[ "$mvflag" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1

            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout "$branch"
            fi

            if [ "$?" != 0 ]; then
              echo "error on $rurl"
              exit 1
            fi

            git sparse-checkout init --cone
            git sparse-checkout set "$@"

            if [[ "$mvflag" != "mv" ]]; then
              cp -rn ./* "$rootdir"/
            else
              mv -n "$@"/* "$rootdir/$@"/
            fi

            cd "$rootdir"
          }

          export -f git_clone_path

          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf "devices/${{ matrix.target }}/." openwrt/
          cp -rf devices openwrt/

          cd openwrt
          chmod +x "devices/common/$DIY_SH"
          /bin/bash "devices/common/$DIY_SH"

          cp -f "devices/common/$CONFIG_FILE" .config
          if [ -f "devices/${{ matrix.target }}/$CONFIG_FILE" ]; then
            echo >> .config
            cat "devices/${{ matrix.target }}/$CONFIG_FILE" >> .config
          fi

          if [ -f "devices/${{ matrix.target }}/$DIY_SH" ]; then
            chmod +x "devices/${{ matrix.target }}/$DIY_SH"
            /bin/bash "devices/${{ matrix.target }}/$DIY_SH"
          fi

          cp -Rf ./diy/* ./ || true

      - name: Apply patches
        shell: bash
        run: |
          set -eux
          cd openwrt

          cp -rn devices/common/patches "devices/${{ matrix.target }}/" || true

          if [[ "${{ matrix.target }}" == "mediatek_filogic" ]]; then
            mkdir -p "devices/${{ matrix.target }}/patches.disabled"

            find "devices/${{ matrix.target }}/patches" -maxdepth 1 -type f ( \
              -iname '*360t7*' -o \
              -iname '*jcg*' -o \
              -iname '*asr3000*' -o \
              -iname '*imou*' -o \
              -iname '*ct3003*' -o \
              -iname '*ea0326*' -o \
              -iname '*netcore*' -o \
              -iname '*cf-wr632ax*' -o \
              -iname '*ax3000t*' -o \
              -iname '*ruijie*' -o \
              -iname '*ax6000*' -o \
              -iname '*ax6s*' -o \
              -iname '*magic-nx30-pro*' \
            ) -exec mv -v {} "devices/${{ matrix.target }}/patches.disabled/" ; || true
          fi

          if compgen -G "devices/${{ matrix.target }}/patches/*.bin.patch" > /dev/null; then
            git apply devices/${{ matrix.target }}/patches/*.bin.patch
          fi

          find "devices/${{ matrix.target }}/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r -I % sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 --ignore-whitespace -i '%'"

          find "devices/${{ matrix.target }}/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r -I % sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 --ignore-whitespace -i '%'"

      - name: Defconfig
        shell: bash
        run: |
          set -eux
          cd openwrt
          make defconfig

          if [[ ! "${{ matrix.target }}" =~ (amlogic_meson8b|armsr_armv8|bcm27xx_*|rockchip_armv8|sunxi_*|x86_*|siflower_*) ]]; then
            sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >> .config
            sed -i "s/(kmod-qca.*)=m/\u0001=n/" .config
            make defconfig
          fi

      - name: Cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: 'false'
          mixkey: ${{ matrix.target }}
          clean: false
          prefix: ${{ github.workspace }}/openwrt

      - name: Compile the firmware
        shell: bash
        run: |
          set -euxo pipefail
          df -hT
          cd openwrt
          echo -e "$(($(nproc)+1)) thread compile"

          make -j"$(($(nproc)+1))" || {
            log=$(mktemp)
            make V=s &> "$log" || true
            tail -200 "$log"
            df -hT
            exit 1
          }

          rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump || true
          rm -rf staging_dir/toolchain-*/initial || true
          df -hT

      - name: Filter requested firmware files
        shell: bash
        run: |
          set -euxo pipefail
          shopt -s nullglob

          target_dir="$(echo openwrt/bin/targets/*/*)"
          out_dir="${GITHUB_WORKSPACE}/artifacts/${{ matrix.artifact_name }}"
          mkdir -p "${out_dir}"

          cp openwrt/.config "${out_dir}/${{ matrix.target }}.config" || true

          kernel_cfg="$(find openwrt/build_dir -path '*/linux-*/*/.config' | head -n 1 || true)"
          if [[ -n "${kernel_cfg}" && -f "${kernel_cfg}" ]]; then
            cp "${kernel_cfg}" "${out_dir}/${{ matrix.target }}_kernel.config"
          fi

          cd "${target_dir}"

          for f in sha256sums profiles.json config.buildinfo feeds.buildinfo version.buildinfo; do
            [[ -f "$f" ]] && cp -a "$f" "${out_dir}/"
          done

          for f in *.manifest; do
            [[ -f "$f" ]] && cp -a "$f" "${out_dir}/"
          done

          for pattern in ${{ matrix.device_filters }}; do
            find . -maxdepth 1 -type f -name "*${pattern}*" -exec cp -a {} "${out_dir}/" ;
          done

          file_count="$(find "${out_dir}" -maxdepth 1 -type f | wc -l)"
          if [[ "${file_count}" -lt 2 ]]; then
            echo "No matching firmware files found for filters: ${{ matrix.device_filters }}"
            echo "Available files:"
            find . -maxdepth 1 -type f | sort
            exit 1
          fi

          ls -lah "${out_dir}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}/
          if-no-files-found: error
          retention-days: 14